<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 85" fill="none">
  <defs>
    <linearGradient id="solarArcGrad" x1="24" y1="68" x2="216" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="sunGlowGrad" x1="175" y1="36" x2="195" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <!-- Horizon Line -->
  <line x1="16" y1="68" x2="224" y2="68" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Solar Arc Path -->
  <path d="M 24 68 Q 120 4 216 68" stroke="url(#solarArcGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Traveled Path Highlight (Sunrise to current ~6 PM position) -->
  <path d="M 24 68 Q 110 8 185 46" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Sun at Current Position (x=185, y=46) -->
  <circle cx="185" cy="46" r="9" fill="url(#sunGlowGrad)" />
  <circle cx="185" cy="46" r="13" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Horizon Nodes -->
  <circle cx="24" cy="68" r="3.5" fill="#FBBF24" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="216" cy="68" r="3.5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
