<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="needleNorthGrad" x1="50" y1="20" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="needleSouthGrad" x1="50" y1="50" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Outer Dial Circle with Ticks -->
  <circle cx="50" cy="50" r="44" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6" />
  <circle cx="50" cy="50" r="38" stroke="#CBD5E1" stroke-width="1" opacity="0.4" />

  <!-- Cardinal Direction Marks -->
  <text x="50" y="16" font-size="10" font-weight="bold" fill="#3B82F6" text-anchor="middle" font-family="system-ui, sans-serif">N</text>
  <text x="50" y="93" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle" font-family="system-ui, sans-serif">S</text>
  <text x="91" y="53.5" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle" font-family="system-ui, sans-serif">E</text>
  <text x="9" y="53.5" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle" font-family="system-ui, sans-serif">W</text>

  <!-- NW Rotated Needle (-45 degrees) -->
  <g transform="rotate(-45 50 50)">
    <!-- North Pointer (Blue) -->
    <polygon points="50,18 45,50 50,47 55,50" fill="url(#needleNorthGrad)" />
    <!-- South Pointer (Light Blue) -->
    <polygon points="50,82 45,50 50,53 55,50" fill="url(#needleSouthGrad)" />
  </g>

  <!-- Center Pivot Pin -->
  <circle cx="50" cy="50" r="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />
  <circle cx="50" cy="50" r="2" fill="#1D4ED8" />
</svg>
