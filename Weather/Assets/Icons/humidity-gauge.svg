<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="humArcGrad" x1="20" y1="80" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Background Track Arc (~270 deg, from 135 deg to 405 deg) -->
  <path d="M 24.64 75.36 A 36 36 0 1 1 75.36 75.36" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" opacity="0.3" />

  <!-- Active Value Arc (58% of 270 deg = ~156 deg, ends around 291 deg) -->
  <path d="M 24.64 75.36 A 36 36 0 0 1 63.6 16.7" stroke="url(#humArcGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Pointer Needle at ~58% -->
  <g transform="rotate(22 50 50)">
    <line x1="50" y1="50" x2="50" y2="22" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Center Pivot -->
  <circle cx="50" cy="50" r="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5" />
  <circle cx="50" cy="50" r="2.5" fill="#1E293B" />
</svg>
